name: Build KapiLocation IPA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build and package unsigned IPA
        run: bash scripts/build-ipa.sh
      - name: Save IPA
        uses: actions/upload-artifact@v4
        with:
          name: KapiLocation-unsigned
          path: outputs/
          if-no-files-found: error
          retention-days: 14
